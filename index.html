<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">HOPE Pexels</h1>

        <div class="container mt-5 mb-5">
            <div class="row d-flex justify-content-center">
                <div class="col-md-10">
                    <div class="card p-3  py-4">
                        <h5>An Easier way to find Photos</h5>
                        <div class="row g-3 mt-2">
                            <div class="col-md-3">
                                <div class="dropdown">
                                  <select class="btn btn-secondary btn-outline dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-expanded="false">
                                        <option value="Nature" class="dropdown-item">Nature</option>
                                        <option value="Nature" class="dropdown-item">City</option>
                                        <option value="Nature" class="dropdown-item">Car</option>
                                  </select>
                          
                                </div>
                            </div>
                            <div class="col-md-6">
                                <input type="text" id="search" class="form-control" placeholder="Search some Photos">
                            </div>
    
                            <div class="col-md-3">
    
                                <button class="btn btn-secondary btn-block" id="s-btn">Search Results</button>
                                
                            </div>
                            
                        </div>
    
    
            <div class="mt-3">               
      <a data-toggle="collapse" href="#collapseExample" role="button" aria-expanded="true" aria-controls="collapseExample" class="advanced">
        Advance Search With Filters <i class="fa fa-angle-down"></i>
      </a>
    <div class="collapse" id="collapseExample">
      <div class="card card-body">
          
         <div class="row">
    
            <div class="col-md-4">
    
                <input type="text" placeholder="Property ID" class="form-control">
                
            </div>
    
    
            <div class="col-md-4">
    
                <input type="text" class="form-control" placeholder="Search by MAP">
                
            </div>
             
    
             <div class="col-md-4">
    
                <input type="text" class="form-control" placeholder="Search by Country">
                
            </div>
             
         </div>
    
      </div>
    </div>
    </div>
    

                    </div>
                    
                </div>
                
            </div>
    
        </div>
        <div class="row" id="gallery">
            <!-- Photos will be dynamically added here -->
        </div>
    </div>




    <!-- Pagination -->
    <div class="container">
        <!-- Gallery title and search section here -->
    
        <div class="row" id="gallery">
            <!-- Photos will be dynamically added here -->
        </div>
    



        
        <!-- Pagination controls -->
        <div class="d-flex justify-content-center my-4">
            <button class="btn btn-secondary mx-2" id="prev-btn" disabled>Previous</button>
            <button class="btn btn-secondary mx-2" id="next-btn">Next</button>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
